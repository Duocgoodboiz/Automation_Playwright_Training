name: Daily Playwright Tests

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch: 

jobs:
  test-and-report:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Tải mã nguồn (Checkout code)
      uses: actions/checkout@v4

    - name: Thiết lập môi trường Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Cài đặt thư viện (Bao gồm Playwright & Allure)
      run: npm install

    - name: Cài đặt trình duyệt Playwright
      run: npx playwright install --with-deps

    - name: Chạy Test Suites
      run: npx playwright test --project=chromium --reporter=allure-playwright
      continue-on-error: true

    - name: Khởi tạo Allure Report
      run: npx -y allure-commandline generate allure-results --clean -o allure-report

    - name: Đóng gói và Lưu Report (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Daily-Allure-Report
        path: allure-report/
        retention-days: 7 