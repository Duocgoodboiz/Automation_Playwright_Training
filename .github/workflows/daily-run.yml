name: Playwright Daily Tests

permissions:
  contents: read
  actions: write

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      fullyParallel:
        description: 'Run tests fully in parallel (true/false)'
        type: boolean
        default: false
      timeout:
        description: 'Test timeout (in milliseconds)'
        type: string
        default: '120000'
      workers:
        description: 'Number of workers (e.g. 1, 2, or 50%)'
        type: string
        default: '1'
      reporter:
        description: 'Final Reporter output'
        type: choice
        options:
          - html
          - list
          - dot
        default: 'html'
      projects:
        description: 'Projects to run (e.g. chromium, firefox)'
        type: string
        default: 'chromium'
      retries:
        description: 'Number of retries on test failure'
        type: string
        default: '0'

jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    
    env:
      CI_FULLY_PARALLEL: ${{ inputs.fullyParallel }}
      CI_TIMEOUT: ${{ inputs.timeout }}
      CI_WORKERS: ${{ inputs.workers }}
      CI_PROJECTS: ${{ inputs.projects }}
      CI_RETRIES: ${{ inputs.retries }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob
      
    - name: Upload blob report to GitHub Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report
        retention-days: 1

  merge-reports:
    if: always()
    needs: [playwright-tests]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Download all blob reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true
        
    - name: Merge into Final Report
      run: npx playwright merge-reports --reporter ${{ inputs.reporter || 'html' }} ./all-blob-reports
      
    - name: Upload Final HTML report
      uses: actions/upload-artifact@v4
      with:
        name: playwright-${{ inputs.reporter || 'html' }}-report
        path: playwright-report
        retention-days: 14

    - name: Delete intermediate blob reports
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api -X GET /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
          --jq '.artifacts[] | select(.name | startswith("blob-report-")) | .url' | \
        xargs -I {} gh api -X DELETE {}